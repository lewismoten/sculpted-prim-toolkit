<!DOCTYPE html>
<html>

<head>
  <title>2D Image to 3D Model</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script type="module" src="index.js"></script>
</head>

<body>
  <canvas id="image-3d" width="320" height="200"></canvas><br />
  <div class="group">
    <div class="group-title">Camera: <span id="camera-angle-selected"></span></div>
    <button id="camera-right">Right</button>
    <button id="camera-left">Left</button>
    <button id="camera-top">Top</button>
    <button id="camera-bottom">Bottom</button>
    <button id="camera-front">Front</button>
    <button id="camera-back">Back</button>
    <button id="camera-iso">Iso</button>
    <button id="camera-perspective">Perspective</button>
    <button id="camera-reset">Reset</button>
  </div>
  <div class="flex">
    <div class="group">
      <div class="group-title">Model</div>
      <select id="image-selector"></select><br />
      <label><input type="checkbox" id="show-model-mesh" checked>Visible</label><br />
      <label><input type="checkbox" id="show-cube">Reference Cube</label>
    </div>
    <div class="group" id="nurbs-container">
      <div>
      <div class="group-title">NURBS</div>
      <label id="show-nurbs-mesh-label"><input type="checkbox" id="show-nurbs-mesh">Visible</label><br />
      <label><input type="checkbox" id="show-control-vertices">Control Vertices</label><br />
      <label><input type="checkbox" id="show-control-mesh">Control Net</label><br />
      <label id="nurbs-degrees-label"><input type="number" id="nurbs-degrees" min="1" max="5" value="1">Degrees</label><br />
      </div>
    </div>
  <div class="group">
    <div class="group-title">
      Model Data: 
      <span id="vertex-position"></span>
      <span class="last-item-right">
        <span id="vertex-color"></span>
      </span>
    </div>
    <div class="flex">
      <canvas id="image-preview"></canvas>
      <div>
        <label>U: <input type="range" id="vertex-column-range" min="0" max="32" step="1" value="0"></label>
        <input type="number" id="vertex-column-value" min="0" max="32" step="1" value="0" class="vertex-column-number">
        <br />
        <label>V: <input type="range" id="vertex-row-range" min="0" max="32" step="1" value="0"></label>
        <input type="number" id="vertex-row-value" min="0" max="32" step="1" value="0" class="vertex-row-number">
        <br />
        <label>Idx: <input type="range" id="vertex-index-range" min="0" max="1024" step="1" value="0"></label>
        <input type="number" id="vertex-index-value" min="0" max="1024" step="1" value="0" class="vertex-index-number">
      </div>
    </div>
    <label>
      <input type="checkbox" id="reveal-vertices">Mask Unused Pixels
    </label>
  </div>
  <div class="group">
    <div class="group-title">Rotation: <span id="rotation-values"></span></div>
    <label>X: <input type="range" id="rotation-x" min="-3.14159" max="3.14159" step="0.01" value="1"></label>
    <input type="number" id="rotation-x-degrees" min="0" max="359.95" step="0.05" value="0" class="angle-input">
    <label><input type="checkbox" id="spin-x">Spin</label>
    <br />
    <label>Y: <input type="range" id="rotation-y" min="-3.14159" max="3.14159" step="0.01" value="1"></label>
    <input type="number" id="rotation-y-degrees" min="0" max="359.95" step="0.05" value="0" class="angle-input">
    <label><input type="checkbox" id="spin-y">Spin</label>
    <br />
    <label>Z: <input type="range" id="rotation-z" min="-3.14159" max="3.14159" step="0.01" value="1"></label>
    <input type="number" id="rotation-z-degrees" min="0" max="359.95" step="0.05" value="0" class="angle-input">
    <label><input type="checkbox" id="spin-z">Spin</label><br />
    <button id="no-rotation">Reset</button>
  </div>
  <div class="group">
    <div class="group-title">Scale: <span id="scale-values"></span></div>
    <label>X: <input type="range" id="scale-x-range" min="0.01" max="1" step="0.01" value="1"></label>
    <input type="number" id="scale-x-value" min="0" max="1" step="0.01" value="0" class="scale-input">
    <br />
    <label>Y: <input type="range" id="scale-y-range" min="0.01" max="1" step="0.01" value="1"></label>
    <input type="number" id="scale-y-value" min="0" max="1" step="0.01" value="0" class="scale-input">
    <br />
    <label>Z: <input type="range" id="scale-z-range" min="0.01" max="1" step="0.01" value="1"></label>
    <input type="number" id="scale-z-value" min="0" max="1" step="0.01" value="0" class="scale-input">

  </div>
  <div class="group">
    <div class="group-title">Texture</div>
    <div class="flex">
      <canvas id="texture-preview"></canvas>
      <div>
        Skin: <select id="texture-selector">
          <option value="">None</option>
          <option value="alignment-map-64">Alignment Map 64</option>
          <option value="alignment-map-128">Alignment Map 128</option>
          <option value="alignment-map-256">Alignment Map 256</option>
          <option value="alignment-map-512">Alignment Map 512</option>
          <option value="alignment-map-1024">Alignment Map 1024</option>
          <option value="alignment-map-2048">Alignment Map 2048</option>
          <option value="alignment-map-4096">Alignment Map 4096</option>
        </select><br />

        <label>Rotate: <input type="range" id="texture-rotation" min="-3.14" max="3.14" step="0.01"
            value="0"></label><br />
        Offset:<br />
        <label>H: <input type="range" id="texture-horizontal-offset" min="-1" max="1" step="0.01"
            value="0"></label><br />
        <label>V: <input type="range" id="texture-vertical-offset" min="-1" max="1" step="0.01" value="0"></label><br />
        Repeat:<br />
        <label>H: <input type="range" id="texture-horizontal-repeat" min="0.01" max="10" step="0.01"
            value="1"></label><br />
        <label>V: <input type="range" id="texture-vertical-repeat" min="0.01" max="10" step="0.01"
            value="1"></label><br />
      </div>
    </div>
  </div>
  <div class="group">
    <div class="group-title">Lighting</div>
    <label>Ambient: <input type="range" id="ambientIntensity" min="0" max="5" step="0.01" value=".5"></label><br />
    <label>Directional: <input type="range" id="directionalIntensity" min="0" max="10" step="0.01"
        value="1"></label><br />
    <label>- Angle: <input type="range" id="directional-light-angle" min="-3.14" max="3.14" step=".01"
        value="0"></label><br />
    <label>- Elevation: <input type="range" id="directional-light-elevation" min="-1" max="1" step=".01"
        value="0"></label><br />
  </div>
  <div class="group">
    <div class="group-title">Details</div>
    Model Image Size: <span id="image-size"></span><br />
    Horizontal Segments: <span id="horizontal-segments"></span><span id="horizontal-downsampling"></span><br />
    Verticle Segments: <span id="vertical-segments"></span><span id="vertical-downsampling"></span><br />
    Vertices: <span id="control-mesh-vertices"></span><br />
    Faces: <span id="control-mesh-faces"></span><br />
    Positions: <span id="control-mesh-positions"></span><br />
  
</div>


</html>
