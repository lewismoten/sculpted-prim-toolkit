<!DOCTYPE html>
<html>
<head>
  <title>2D Image to 3D Model</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script type="module" src="index.js"></script>
</head>
<body>
  Sculptured Prim: <select id="image-selector"></select>
  <span id="image-size"></span><br />
  Texture: <select id="texture-selector"></select><br />
  <canvas id="image-preview"></canvas><br />
  <canvas id="image-3d" width="320" height="200"></canvas><br />
  <label><input type="checkbox" id="rotate-object" checked>Rotate Object</label><br />
  <label>Scale X: <input type="range" id="scaleX" min="0.01" max="1" step="0.01" value="1"></label><br />
  <label>Scale Y: <input type="range" id="scaleY" min="0.01" max="1" step="0.01" value="1"></label><br />
  <label>Scale Z: <input type="range" id="scaleZ" min="0.01" max="1" step="0.01" value="1"></label><br />
  <label><input type="checkbox" id="show-cube">Cube</label>
  <label><input type="checkbox" id="show-control-vertices">Control Vertices</label>
  <label><input type="checkbox" id="show-control-mesh" checked>Control Mesh</label><br />
  Light Intensity:<br />
  <label>Ambient: <input type="range" id="ambientIntensity" min="0" max="5" step="0.01" value=".5"></label><br />
  <label>Directional: <input type="range" id="directionalIntensity" min="0" max="10" step="0.01" value="1"></label><br />
  Horizontal Segments: <span id="horizontal-segments"></span><br />
  Verticle Segments: <span id="vertical-segments"></span><br />
  Vertices: <span id="control-mesh-vertices"></span><br />
  Faces: <span id="control-mesh-faces"></span><br />
  
</html>
